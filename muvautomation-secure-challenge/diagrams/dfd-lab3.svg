<svg viewBox="0 0 980 480" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="980" height="480" fill="#ffffff"/>

  <!-- Trust boundary 1: red -> server -->
  <rect x="330" y="40" width="600" height="400" fill="none" stroke="#9a3324" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="340" y="30" font-size="13" fill="#9a3324">Límite de confianza 1 — red del laboratorio → servidor</text>

  <!-- Trust boundary 2: app -> filesystem -->
  <rect x="640" y="70" width="270" height="330" fill="none" stroke="#3b5166" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="650" y="95" font-size="13" fill="#3b5166">Límite 2 — aplicación →</text>
  <text x="650" y="111" font-size="13" fill="#3b5166">sistema de archivos</text>

  <!-- Kali / Red team -->
  <rect x="40" y="160" width="160" height="80" rx="6" fill="#eef1f4" stroke="#33475b" stroke-width="1.5"/>
  <text x="120" y="195" font-size="14" text-anchor="middle" fill="#20303f">Kali</text>
  <text x="120" y="213" font-size="12" text-anchor="middle" fill="#5a6b7a">Red Team</text>

  <!-- Red del laboratorio -->
  <rect x="360" y="160" width="160" height="80" rx="6" fill="#eef1f4" stroke="#33475b" stroke-width="1.5"/>
  <text x="440" y="195" font-size="14" text-anchor="middle" fill="#20303f">Red del laboratorio</text>
  <text x="440" y="213" font-size="12" text-anchor="middle" fill="#5a6b7a">HTTP sin TLS</text>

  <!-- Nginx -->
  <rect x="680" y="150" width="190" height="90" rx="6" fill="#e4ebe6" stroke="#3b6b4a" stroke-width="1.5"/>
  <text x="775" y="185" font-size="14" text-anchor="middle" fill="#264430">Nginx</text>
  <text x="775" y="203" font-size="12" text-anchor="middle" fill="#4b6b57">puerto 80/tcp</text>
  <text x="775" y="219" font-size="12" text-anchor="middle" fill="#4b6b57">filtrado por ufw</text>

  <!-- Archivos del sitio -->
  <rect x="680" y="300" width="190" height="80" rx="6" fill="#eef1f4" stroke="#33475b" stroke-width="1.5"/>
  <text x="775" y="333" font-size="14" text-anchor="middle" fill="#20303f">Archivos del sitio</text>
  <text x="775" y="351" font-size="11" text-anchor="middle" fill="#5a6b7a">index.html · public-inventory.txt</text>

  <!-- Blue team -->
  <rect x="380" y="300" width="200" height="90" rx="6" fill="#eef1f4" stroke="#33475b" stroke-width="1.5"/>
  <text x="480" y="330" font-size="14" text-anchor="middle" fill="#20303f">Blue Team</text>
  <text x="480" y="348" font-size="11" text-anchor="middle" fill="#5a6b7a">access.log · error.log</text>
  <text x="480" y="364" font-size="11" text-anchor="middle" fill="#5a6b7a">tcpdump</text>

  <!-- Arrows -->
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#556575"/>
    </marker>
  </defs>

  <line x1="200" y1="195" x2="355" y2="195" stroke="#556575" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="270" y="185" font-size="11" fill="#556575">1. petición HTTP (curl, nmap)</text>

  <line x1="520" y1="195" x2="675" y2="190" stroke="#556575" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="545" y="180" font-size="11" fill="#556575">2. tráfico en claro</text>

  <line x1="775" y1="240" x2="775" y2="295" stroke="#556575" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="785" y="270" font-size="11" fill="#556575">3. lee archivo</text>

  <line x1="680" y1="340" x2="585" y2="340" stroke="#556575" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="600" y="330" font-size="11" fill="#556575">4. contenido</text>

  <path d="M 680 210 C 300 260, 280 300, 385 335" fill="none" stroke="#7d8c99" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
  <text x="330" y="280" font-size="11" fill="#7d8c99">5. respuesta 200/404 + headers</text>

  <line x1="480" y1="300" x2="440" y2="245" stroke="#7d8c99" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
  <text x="450" y="270" font-size="11" fill="#7d8c99">6. observa evento</text>

  <text x="40" y="30" font-size="15" fill="#20303f" font-weight="600">DFD — Lab 3: CrowdStrike Incident Hub</text>
</svg>
